<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8541E-Uboot-Patcher</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#262d36;--fg:#e6edf3;--dim:#8b949e;
      --ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif}
header{padding:28px 20px 6px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:22px;letter-spacing:.3px}
h1 span{color:var(--acc)}
.sub{color:var(--dim);margin:6px 0 0;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:16px 18px;margin:14px 0}
.card h2{margin:0 0 12px;font-size:13px;color:var(--dim);font-weight:600;
         text-transform:uppercase;letter-spacing:.8px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;flex-wrap:wrap}
.row>label{width:120px;flex:none}
.req{color:var(--acc);font-size:12px}
.opt{color:var(--dim);font-size:12px}
input[type=file]{flex:1;min-width:190px;color:var(--dim);font-size:13px}
.badge{font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);
       color:var(--dim);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.err{color:var(--err);border-color:var(--err)}
#ub-status{margin:0 0 6px 130px}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;
      border:1px solid var(--line);margin:0 6px 4px 0;color:var(--dim)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.err{color:var(--err);border-color:var(--err)}
.chk{display:block;padding:4px 0}
.chk input{margin-right:8px}
.banner-texts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.banner-texts label{font-size:13px;color:var(--dim)}
.banner-texts input{width:100%;margin-top:4px;background:#0d1117;color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
button{background:var(--acc);color:#04121f;border:0;border-radius:9px;font-weight:600;
       padding:10px 22px;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);
             padding:7px 16px;font-size:13px;margin-top:8px}
#log{background:#0d1117;border:1px solid var(--line);border-radius:9px;margin-top:14px;
     padding:12px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
     white-space:pre-wrap;min-height:60px;max-height:420px;overflow:auto;color:#c9d1d9}
#log:empty{display:none}
.dl-row{display:flex;align-items:center;gap:12px;padding:7px 0;flex-wrap:wrap}
.dl-row .meta{color:var(--dim);font-size:12px;font-family:ui-monospace,monospace}
footer{color:var(--dim);font-size:12px;text-align:center;padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <h1>8541E-Uboot-Patcher <span>Web</span></h1>
  <p class="sub">SL8541e 手表三合一：去保护（splloader / uboot / trustos）＋ usblog 实时日志注入 ＋ 横幅替换。全程本地处理，文件不上传。</p>
</header>
<main>
  <section class="card">
    <h2>1 · 选择镜像</h2>
    <div class="row"><label>splloader <span class="opt">可选</span></label>
      <input type="file" id="f-spl"><span class="badge idle" id="b-spl">未选择</span></div>
    <div class="row"><label>uboot <span class="req">必需</span></label>
      <input type="file" id="f-ub"><span class="badge idle" id="b-ub">未选择</span></div>
    <div id="ub-status"></div>
    <div class="row"><label>trustos <span class="opt">可选</span></label>
      <input type="file" id="f-tr"><span class="badge idle" id="b-tr">未选择</span></div>
  </section>

  <section class="card">
    <h2>2 · 选项</h2>
    <label class="chk"><input type="checkbox" id="o-unlock" checked> 去保护 — splloader secure boot / uboot lock / trustos AVB</label>
    <label class="chk"><input type="checkbox" id="o-usblog" checked> usblog 注入 — uboot USB 实时日志</label>
    <label class="chk"><input type="checkbox" id="o-banner" checked> 替换横幅</label>
    <div class="banner-texts">
      <label>warn 横幅（≤48 字节；输入里的 \n 会转义为换行）
        <input id="t-warn" value="QQ:3981750101\nBoot Format OK, Kernel Started...\n"></label>
      <label>info 横幅（≤35 字节）
        <input id="t-info" value="SPRD U-Boot - Patch By Dunoguang  \n"></label>
    </div>
  </section>

  <section class="card">
    <h2>3 · 执行</h2>
    <button id="go">处理</button>
    <pre id="log"></pre>
  </section>

  <section class="card" id="dl-card" hidden>
    <h2>4 · 下载</h2>
    <div id="downloads"></div>
  </section>
</main>
<footer>MIT © 2026 Dunoguang · 8541E-Uboot-Patcher</footer>
<script src="tpl.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
